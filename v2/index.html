<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Zéphyr V2</title>
<style>
:root{--bg:#f3f6f8;--surface:#fff;--fg:#14222b;--muted:#566772;--line:#d3dde3;--accent:#0b6e8a;--accent-fg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;margin:0}
.lead{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:1.2rem;margin:0;color:var(--accent)}
.card ul{margin:0;padding-left:1.2em;color:var(--muted)}
button{font:inherit;padding:12px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:48px}
button.ghost{background:var(--surface);color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.note{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const KEY="zephyr-v2-parcours";
const PARCOURS={
  du:{nom:"Parcours DU PaRéO",desc:"Chiffres ronds, à l'euro près.",items:["Leçons 1 à 6","Texte parlé de 3 minutes","Formules Excel pas à pas","Simulation sur trois années"]},
  dscg:{nom:"Parcours DSCG / Master",desc:"Deux décimales, pour le contrôle de gestion.",items:["Leçons 6 à 8","Projet de calcul des écarts","Formules Excel pas à pas","Questions et diagnostic"]}
};
let parcours=localStorage.getItem(KEY)||"";
function render(){
  const app=document.getElementById("app");
  if(!parcours){
    app.innerHTML=`<h1>Atelier Zéphyr</h1>
    <p class="lead">Une entreprise fictive qui conçoit des drones d'inspection. Vous la dirigez seul, sur trois années. Choisissez votre parcours.</p>
    <div class="cards">${Object.entries(PARCOURS).map(([k,p])=>`
      <div class="card"><h2>${p.nom}</h2><p class="note">${p.desc}</p>
      <ul>${p.items.map(i=>`<li>${i}</li>`).join("")}</ul>
      <button data-p="${k}">Commencer ce parcours</button></div>`).join("")}
    </div>
    <p class="note">Les données sont fictives. Votre progression reste dans ce navigateur.</p>`;
  } else {
    const p=PARCOURS[parcours];
    app.innerHTML=`<div class="bar"><h1>${p.nom}</h1><button class="ghost" data-reset="1">Changer de parcours</button></div>
    <p class="lead">Accueil du parcours. Les leçons, le texte parlé, les formules Excel et la simulation arrivent dans les prochaines étapes.</p>
    <ul>${p.items.map(i=>`<li>${i}</li>`).join("")}</ul>`;
  }
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.p){parcours=b.dataset.p;localStorage.setItem(KEY,parcours);render();window.scrollTo(0,0);}
  if(b.dataset.reset){parcours="";localStorage.removeItem(KEY);render();}
});
render();
</script>
</body>
</html>
